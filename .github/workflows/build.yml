name: Bina APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Baca versi
        run: |
          source version.properties
          echo "APPV=$VERSION" >> "$GITHUB_ENV"
          echo "APPB=$BUILD" >> "$GITHUB_ENV"
      - name: Buka zip projek
        run: unzip -q projek.zip -d src
      - name: Bina APK
        run: cd src && gradle assembleDebug -PappVersion=$APPV -PbuildNumber=$APPB
      - name: Namakan APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk Muzik-v$APPV-b$APPB.apk
      - name: Sediakan nota perubahan
        run: |
          touch perubahan.md
          awk -v v="## v$APPV" 'index($0,v)==1{f=1;print;next} /^## /{f=0} f' perubahan.md > nota.md || true
          if [ ! -s nota.md ]; then echo "## v$APPV (bina $APPB)" > nota.md; fi
          {
            echo
            echo "---"
            echo "Bina: $APPB"
            echo "Muat turun fail APK di bawah dan pasang terus di atas versi lama."
          } >> nota.md
      - name: Terbitkan
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APPV }}-b${{ env.APPB }}
          name: Muzik v${{ env.APPV }} (bina ${{ env.APPB }})
          body_path: nota.md
          files: Muzik-v${{ env.APPV }}-b${{ env.APPB }}.apk
